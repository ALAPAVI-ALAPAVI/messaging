<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dev Workspace IDE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Consolas', 'Courier New', Courier, monospace; }
        body, html { background-color: #1e1e1e; color: #d4d4d4; height: 100%; width: 100%; overflow: hidden; position: fixed; }
        
        /* --- STAGE 1: THE DISGUISE --- */
        #editor-container { display: flex; flex-direction: column; width: 100%; height: 100%; }
        .editor-header { background-color: #2d2d2d; padding: 8px 12px; font-size: 11px; color: #858585; border-bottom: 1px solid #3c3c3c; display: flex; justify-content: space-between; align-items: center; }
        .tabs { display: flex; gap: 20px; }
        .tab { color: #fff; border-bottom: 1px solid #007acc; padding-bottom: 4px; }
        .editor-workspace { display: flex; flex: 1; position: relative; }
        .line-numbers { width: 40px; background-color: #1e1e1e; padding-top: 16px; text-align: right; padding-right: 10px; color: #5a5a5a; font-size: 13px; line-height: 1.5; user-select: none; }
        .code-textarea { flex: 1; background-color: #1e1e1e; border: none; outline: none; color: #4ec9b0; padding: 16px 8px 16px 0; font-size: 13px; line-height: 1.5; resize: none; }

        /* --- STAGE 2: PASSCODE GATEWAY --- */
        #lock-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1e1e1e; justify-content: center; align-items: center; z-index: 9999; }
        .auth-container { text-align: center; width: 260px; }
        .auth-container label { display: block; font-size: 12px; color: #6a9955; margin-bottom: 12px; }
        .passcode-input { width: 100%; padding: 12px; text-align: center; font-size: 18px; background-color: #2d2d2d; border: 1px solid #3c3c3c; color: #ce9178; border-radius: 4px; outline: none; letter-spacing: 3px; }
        .error-msg { font-size: 11px; color: #f44747; margin-top: 8px; visibility: hidden; }

        /* --- STAGE 3: CHAT VIEW & ROOM SETUP --- */
        #app-container { display: none; width: 100%; height: 100%; grid-template-columns: 280px 1fr; background-color: #252526; }
        .sidebar { background-color: #2d2d2d; border-right: 1px solid #3c3c3c; display: flex; flex-direction: column; padding: 12px; gap: 10px; overflow-y: auto;}
        .sidebar-header { font-size: 11px; color: #858585; text-transform: uppercase; margin-bottom: 4px; }
        .net-box { background-color: #1e1e1e; border: 1px solid #3c3c3c; padding: 12px; border-radius: 4px; display: flex; flex-direction: column; gap: 8px; }
        .net-box p { font-size: 11px; color: #858585; line-height: 1.4; }
        .room-input { width: 100%; padding: 8px; font-size: 12px; background-color: #2d2d2d; border: 1px solid #3c3c3c; color: #9cdcfe; border-radius: 4px; outline: none; }
        .net-btn { background-color: #007acc; color: #fff; border: none; padding: 8px; font-size: 12px; cursor: pointer; border-radius: 3px; font-weight: bold; }
        .net-btn:disabled { background-color: #3c3c3c; color: #777; cursor: not-allowed; }

        .workspace { display: flex; flex-direction: column; background-color: #1e1e1e; overflow: hidden; }
        .workspace-header { padding: 12px 16px; border-bottom: 1px solid #3c3c3c; display: flex; justify-content: space-between; align-items: center; background-color: #2d2d2d; }
        .workspace-title { font-size: 12px; color: #cccccc; }
        .lock-btn { background: none; border: 1px solid #444; padding: 4px 10px; border-radius: 3px; font-size: 11px; cursor: pointer; color: #858585; }
        .content-stream { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        
        .entry-row { display: flex; width: 100%; }
        .entry-row.outgoing { justify-content: flex-end; }
        .entry-row.incoming { justify-content: flex-start; }
        .entry-body { max-width: 85%; font-size: 13px; line-height: 1.5; color: #d4d4d4; word-break: break-word; }
        .entry-row.outgoing .entry-body { text-align: right; color: #9cdcfe; }
        .entry-row.incoming .entry-body { color: #ce9178; }
        .meta-tag { font-size: 10px; color: #6a9955; margin-bottom: 3px; display: block; }

        .input-area { padding: 12px 16px; border-top: 1px solid #3c3c3c; display: flex; gap: 8px; background-color: #1e1e1e; }
        .text-input { flex: 1; padding: 10px; border: 1px solid #3c3c3c; border-radius: 4px; font-size: 13px; outline: none; background-color: #2d2d2d; color: #fff; }
        .action-btn { background-color: #007acc; color: #fff; border: none; padding: 0 14px; border-radius: 4px; font-size: 13px; cursor: pointer; }

        @media (max-width: 680px) {
            #app-container { grid-template-columns: 1fr; }
            .sidebar { border-right: none; border-bottom: 1px solid #3c3c3c; max-height: 140px; }
        }
    </style>
</head>
<body>

    <!-- STAGE 1: THE DISGUISE -->
    <div id="editor-container">
        <div class="editor-header">
            <div class="tabs"><span class="tab">db_config.js</span></div>
        </div>
        <div class="editor-workspace">
            <div id="line-counter" class="line-numbers">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12</div>
            <textarea id="codeEditor" class="code-textarea" spellcheck="false" autofocus></textarea>
        </div>
    </div>

    <!-- STAGE 2: PASSCODE GATEWAY -->
    <div id="lock-screen">
        <div class="auth-container">
            <label for="passcode">/* RUNTIME_AUTH_REQUIRED */</label>
            <input type="password" id="passcode" class="passcode-input" pattern="[0-9]*" inputmode="numeric" maxlength="8" placeholder="••••">
            <div id="error" class="error-msg">Execution signature failed.</div>
        </div>
    </div>

    <!-- STAGE 3: CHAT VIEW & ROOM SETUP -->
    <div id="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">Session Manager</div>
            <div class="net-box">
                <p>Enter a shared Room Key to link with the other user:</p>
                <input type="text" id="roomKeyInput" class="room-input" placeholder="e.g. shadow_alpha_99">
                <button class="net-btn" id="connectBtn">Connect Room</button>
            </div>
            <div class="net-box" style="margin-top: auto; border: none; padding: 0;">
                <p id="mode-notice" style="color: #6a9955;">Universal Mode Initialized.</p>
            </div>
        </aside>

        <main class="workspace">
            <header class="workspace-header">
                <div class="workspace-title" id="connection-status">Offline (Enter room key on left)</div>
                <button class="lock-btn" id="manual-lock">Abort Session</button>
            </header>
            <div class="content-stream" id="contentStream"></div>
            <footer class="input-area">
                <input type="text" class="text-input" id="messageInput" placeholder="Write to buffer..." disabled>
                <button class="action-btn" id="submitBtn" disabled>Execute</button>
            </footer>
        </main>
    </div>

    <script>
        const SECRET_COMMAND = "// system.initialize.terminal.call()";
        const ACCESS_CODE = "1234";
        const TEMPLATE_CODE = `/**\n * @file db_config.js\n * @description Production cluster routing setup module.\n */\n\nconst cluster = require('cluster_node');\nconst engine = new cluster.Engine({\n    port: 8080,\n    environment: "production",\n    secureMode: true\n});\n\n`;

        const myUUID = 'user_' + Math.random().toString(36).substr(2, 9);
        const codeEditor = document.getElementById('codeEditor'), lockScreen = document.getElementById('lock-screen');
        const editorContainer = document.getElementById('editor-container'), appContainer = document.getElementById('app-container');
        const passcodeField = document.getElementById('passcode'), errorMsg = document.getElementById('error');
        const manualLock = document.getElementById('manual-lock'), messageInput = document.getElementById('messageInput');
        const submitBtn = document.getElementById('submitBtn'), contentStream = document.getElementById('contentStream');
        const connStatus = document.getElementById('connection-status'), lineCounter = document.getElementById('line-counter');
        const roomKeyInput = document.getElementById('roomKeyInput'), connectBtn = document.getElementById('connectBtn');

        let ws = null;
        let roomChannel = "";
        let currentRoomKey = "";

        // Detect engine context instantly to adapt protocols
        const isMobileFile = window.location.protocol === 'file:' && /Mobi|Android|iPhone/i.test(navigator.userAgent);

        window.addEventListener('DOMContentLoaded', () => {
            codeEditor.value = TEMPLATE_CODE;
            updateLineNumbers();
            codeEditor.focus();
            if (isMobileFile) {
                document.getElementById('mode-notice').innerText = "✓ Native Mobile Link Optimized";
            }
        });

        function updateLineNumbers() {
            const lines = codeEditor.value.split('\n').length;
            let numbersHtml = '';
            for(let i = 1; i <= Math.max(lines, 12); i++) { numbersHtml += i + '<br>'; }
            lineCounter.innerHTML = numbersHtml;
        }

        /* --- Disguise Logic --- */
        codeEditor.addEventListener('input', function() {
            updateLineNumbers();
            if (codeEditor.value.includes(SECRET_COMMAND)) {
                codeEditor.value = codeEditor.value.replace(SECRET_COMMAND, '');
                updateLineNumbers();
                editorContainer.style.display = 'none';
                lockScreen.style.display = 'flex';
                passcodeField.focus();
            }
        });

        codeEditor.addEventListener('scroll', () => { lineCounter.scrollTop = codeEditor.scrollTop; });

        passcodeField.addEventListener('input', function() {
            if (passcodeField.value === ACCESS_CODE) {
                errorMsg.style.visibility = 'hidden';
                passcodeField.value = '';
                lockScreen.style.display = 'none';
                appContainer.style.display = 'grid';
                roomKeyInput.focus();
            } else if (passcodeField.value.length >= ACCESS_CODE.length) {
                errorMsg.style.visibility = 'visible';
                passcodeField.value = '';
            }
        });

        function clearView() {
            if(ws) { ws.close(); ws = null; }
            appContainer.style.display = 'none';
            lockScreen.style.display = 'none';
            editorContainer.style.display = 'flex';
            codeEditor.value = TEMPLATE_CODE;
            updateLineNumbers();
            roomKeyInput.disabled = false;
            connectBtn.disabled = false;
            messageInput.disabled = true;
            submitBtn.disabled = true;
            connStatus.innerText = "Offline (Enter room key on left)";
            connStatus.style.color = "#cccccc";
            contentStream.innerHTML = ""; // Clear active stream view
            currentRoomKey = "";
            codeEditor.focus();
        }

        manualLock.addEventListener('click', clearView);
        document.addEventListener('visibilitychange', () => { if (document.hidden) clearView(); });

        /* --- Storage Management Engine --- */
        function getStorageKey(room) {
            return `msg_log_v1_${room}`;
        }

        function saveMessageToLocal(text, direction, time) {
            if (!currentRoomKey) return;
            const key = getStorageKey(currentRoomKey);
            let currentLogs = [];
            try {
                currentLogs = JSON.parse(localStorage.getItem(key)) || [];
            } catch (e) {
                currentLogs = [];
            }
            currentLogs.push({ text, direction, time });
            localStorage.setItem(key, JSON.stringify(currentLogs));
        }

        function loadRoomHistory(room) {
            contentStream.innerHTML = ""; // Clear container
            const key = getStorageKey(room);
            let savedLogs = [];
            try {
                savedLogs = JSON.parse(localStorage.getItem(key)) || [];
            } catch (e) {
                savedLogs = [];
            }
            savedLogs.forEach(log => {
                appendMessageToDOM(log.text, log.direction, log.time);
            });
        }

        /* --- Universal Zero-Config WebSocket Pipeline --- */
        connectBtn.addEventListener('click', () => {
            const roomKey = roomKeyInput.value.trim().toLowerCase();
            if(!roomKey) return;

            currentRoomKey = roomKey;
            roomKeyInput.disabled = true;
            connectBtn.disabled = true;
            connStatus.innerText = "Opening secure link...";
            connStatus.style.color = "#daa520";

            // Instantly restore localized historical records if they exist
            loadRoomHistory(currentRoomKey);

            roomChannel = btoa(roomKey).replace(/=/g, "");

            // Uses native public cloud architecture with browser compatibility fallbacks
            ws = new WebSocket('wss://broker.hivemq.com:8884/mqtt');

            ws.onopen = () => {
                // Initialize raw protocol handshakes compatible with both desktop firewalls and mobile files
                const connectPacket = new Uint8Array([
                    0x10, 12 + myUUID.length, 
                    0x00, 0x04, 0x4d, 0x51, 0x54, 0x54, 0x04, 0x02, 0x00, 0x3c, 
                    0x00, myUUID.length, ...new TextEncoder().encode(myUUID)
                ]);
                ws.send(connectPacket);

                const topic = "p2p/univ/" + roomChannel;
                const subPacket = new Uint8Array([
                    0x82, 5 + topic.length, 
                    0x00, 0x01, 0x00, topic.length, ...new TextEncoder().encode(topic), 0x00
                ]);
                ws.send(subPacket);

                connStatus.innerText = `Connected to Room: ${roomKey}`;
                connStatus.style.color = "#6a9955";
                messageInput.disabled = false;
                submitBtn.disabled = false;
                messageInput.focus();
            };

            ws.onmessage = (event) => {
                if (event.data instanceof Blob) {
                    const reader = new FileReader();
                    reader.onload = () => handleRawPacket(new Uint8Array(reader.result));
                    reader.readAsArrayBuffer(event.data);
                } else if (event.data instanceof ArrayBuffer) {
                    handleRawPacket(new Uint8Array(event.data));
                }
            };

            ws.onclose = () => {
                connStatus.innerText = "Disconnected.";
                connStatus.style.color = "#f44747";
            };
        });

        function handleRawPacket(data) {
            if ((data[0] & 0xF0) === 0x30) {
                // Read exact byte array offsets safely across desktop & mobile engines
                let len = data[1];
                let offset = 2;
                if (len & 0x80) { offset = 3; } // Account for multi-byte remaining lengths
                
                const topicLength = (data[offset] << 8) | data[offset + 1];
                const msgBytes = data.subarray(offset + 2 + topicLength);
                const rawStr = new TextDecoder().decode(msgBytes);
                
                try {
                    const payload = JSON.parse(rawStr);
                    if (payload.sender !== myUUID) {
                        appendMessageToDOM(payload.text, 'incoming', payload.time);
                        saveMessageToLocal(payload.text, 'incoming', payload.time);
                    }
                } catch(e) {}
            }
        }

        /* --- Message Delivery Engine --- */
        function commitMessage() {
            const val = messageInput.value.trim();
            if (val === '' || !ws || ws.readyState !== WebSocket.OPEN) return;

            const timestamp = new Date().toTimeString().split(' ')[0];
            const payload = JSON.stringify({ sender: myUUID, text: val, time: timestamp });
            const topic = "p2p/univ/" + roomChannel;
            const payloadBytes = new TextEncoder().encode(payload);
            const topicBytes = new TextEncoder().encode(topic);

            const packet = new Uint8Array([
                0x30, 2 + topicBytes.length + payloadBytes.length,
                0x00, topicBytes.length, ...topicBytes, ...payloadBytes
            ]);

            ws.send(packet);
            appendMessageToDOM(val, 'outgoing', timestamp);
            saveMessageToLocal(val, 'outgoing', timestamp);
            messageInput.value = '';
        }

        function appendMessageToDOM(text, direction, time) {
            const row = document.createElement('div');
            row.classList.add('entry-row', direction);
            const body = document.createElement('div');
            body.classList.add('entry-body');
            const tag = direction === 'outgoing' ? 'NODE_LOCAL' : 'NODE_REMOTE';
            body.innerHTML = `<span class="meta-tag">// [${tag}] at ${time}</span>${text}`;
            row.appendChild(body);
            contentStream.appendChild(row);
            setTimeout(() => { contentStream.scrollTop = contentStream.scrollHeight; }, 30);
        }

        submitBtn.addEventListener('click', commitMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') commitMessage(); });
    </script>
</body>
</html>
