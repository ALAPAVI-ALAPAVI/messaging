<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Workspace IDE</title>
    <!-- Include PubNub library for anonymous cloud room routing -->
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
        }

        body, html {
            background-color: #1e1e1e;
            color: #d4d4d4;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* --- STAGE 1: THE DISGUISE --- */
        #editor-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .editor-header {
            background-color: #2d2d2d;
            padding: 8px 16px;
            font-size: 12px;
            color: #858585;
            border-bottom: 1px solid #3c3c3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tabs { display: flex; gap: 20px; }
        .tab { color: #fff; border-bottom: 1px solid #007acc; padding-bottom: 4px; }

        /* Discreet Room Config Entry Box */
        .room-setup {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 11px;
        }
        .room-setup input {
            background: #1e1e1e;
            border: 1px solid #444;
            color: #fff;
            padding: 2px 6px;
            font-size: 11px;
            outline: none;
            width: 130px;
        }
        .room-setup button {
            background: #3c3c3c;
            color: #ccc;
            border: 1px solid #555;
            padding: 2px 8px;
            cursor: pointer;
        }
        .room-setup button:hover {
            background: #007acc;
            color: #fff;
        }

        .editor-workspace {
            display: flex;
            flex: 1;
        }

        .line-numbers {
            width: 45px;
            background-color: #1e1e1e;
            padding-top: 16px;
            text-align: right;
            padding-right: 12px;
            color: #858585;
            font-size: 14px;
            line-height: 1.5;
            user-select: none;
        }

        .code-textarea {
            flex: 1;
            background-color: #1e1e1e;
            border: none;
            outline: none;
            color: #9cdcfe;
            padding-top: 16px;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
        }

        /* --- STAGE 2: PASSCODE GATEWAY --- */
        #lock-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-container { text-align: center; width: 280px; }
        .auth-container label { display: block; font-size: 12px; color: #6a9955; margin-bottom: 12px; }
        .passcode-input {
            width: 100%; padding: 10px; text-align: center; font-size: 16px;
            background-color: #2d2d2d; border: 1px solid #3c3c3c; color: #ce9178; border-radius: 4px; outline: none;
        }
        .error-msg { font-size: 11px; color: #f44747; margin-top: 8px; visibility: hidden; }

        /* --- STAGE 3: CHAT VIEW --- */
        #app-container {
            display: none; 
            width: 100%;
            height: 100%;
            grid-template-columns: 240px 1fr;
            background-color: #252526;
        }

        .sidebar { background-color: #2d2d2d; border-right: 1px solid #3c3c3c; display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #3c3c3c; font-size: 11px; color: #858585; }
        .list-item { padding: 10px 16px; font-size: 13px; color: #cccccc; }
        .list-item.active { background-color: #37373d; color: #fff; }

        .workspace { display: flex; flex-direction: column; background-color: #1e1e1e; }
        .workspace-header {
            padding: 12px 20px; border-bottom: 1px solid #3c3c3c;
            display: flex; justify-content: space-between; align-items: center; background-color: #2d2d2d;
        }
        .workspace-title { font-size: 13px; color: #cccccc; }
        .lock-btn {
            background: none; border: 1px solid #444; padding: 4px 10px;
            border-radius: 3px; font-size: 11px; cursor: pointer; color: #858585;
        }
        .lock-btn:hover { background-color: #3c3c3c; color: #fff; }

        .content-stream { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        
        .entry-row { display: flex; width: 100%; }
        .entry-row.outgoing { justify-content: flex-end; }
        .entry-row.incoming { justify-content: flex-start; }

        .entry-body { max-width: 70%; font-size: 13px; line-height: 1.6; color: #d4d4d4; }
        .entry-row.outgoing .entry-body { text-align: right; color: #9cdcfe; }
        .entry-row.incoming .entry-body { color: #ce9178; }
        .meta-tag { font-size: 11px; color: #6a9955; margin-bottom: 4px; display: block; }

        .input-area { padding: 16px 24px; border-top: 1px solid #3c3c3c; display: flex; gap: 12px; background-color: #1e1e1e; }
        .text-input { flex: 1; padding: 10px; border: 1px solid #3c3c3c; border-radius: 4px; font-size: 13px; outline: none; background-color: #2d2d2d; color: #fff; }
        .action-btn { background-color: #007acc; color: #fff; border: none; padding: 0 16px; border-radius: 4px; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- STAGE 1: THE DISGUISE -->
    <div id="editor-container">
        <div class="editor-header">
            <div class="tabs">
                <span class="tab">scratchpad.js</span>
            </div>
            <!-- Discreet Shared Room Identifier Config -->
            <div class="room-setup">
                <input type="text" id="room-key-input" placeholder="Room Key...">
                <button id="link-room-btn">Link Room</button>
            </div>
        </div>
        <div class="editor-workspace">
            <div class="line-numbers">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</div>
            <textarea id="codeEditor" class="code-textarea" spellcheck="false" autofocus placeholder="// Type scratch code here..."></textarea>
        </div>
    </div>

    <!-- STAGE 2: HIDDEN GATEWAY -->
    <div id="lock-screen">
        <div class="auth-container">
            <label for="passcode">/* RUNTIME_AUTH_REQUIRED */</label>
            <input type="password" id="passcode" class="passcode-input" maxlength="8" placeholder="••••">
            <div id="error" class="error-msg">Execution signature failed.</div>
        </div>
    </div>

    <!-- STAGE 3: THE DISCREET CHAT ENVIRONMENT -->
    <div id="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">RUNTIME_REPOSITORIES</div>
            <div class="list-item active">buffer_stream_01.log</div>
        </aside>

        <main class="workspace">
            <header class="workspace-header">
                <div class="workspace-title" id="connection-status">Pipeline Offline (No Room Linked)</div>
                <button class="lock-btn" id="manual-lock">Abort Session</button>
            </header>
            
            <div class="content-stream" id="contentStream"></div>
            
            <footer class="input-area">
                <input type="text" class="text-input" id="messageInput" placeholder="Write to buffer...">
                <button class="action-btn" id="submitBtn">Execute</button>
            </footer>
        </main>
    </div>

    <script>
        const SECRET_COMMAND = "// system.initialize.terminal.call()";
        const ACCESS_CODE = "1234";

        // Element targets
        const codeEditor = document.getElementById('codeEditor'), lockScreen = document.getElementById('lock-screen');
        const editorContainer = document.getElementById('editor-container'), appContainer = document.getElementById('app-container');
        const passcodeField = document.getElementById('passcode'), errorMsg = document.getElementById('error');
        const manualLock = document.getElementById('manual-lock'), messageInput = document.getElementById('messageInput');
        const submitBtn = document.getElementById('submitBtn'), contentStream = document.getElementById('contentStream');
        const roomKeyInput = document.getElementById('room-key-input'), linkRoomBtn = document.getElementById('link-room-btn'), connStatus = document.getElementById('connection-status');

        let pubnub = null;
        let currentRoom = "";
        
        // Generate a persistent unique ID for *this* browser session to distinguish sender vs receiver
        let myUUID = localStorage.getItem('chat_user_uuid');
        if (!myUUID) {
            myUUID = 'usr_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('chat_user_uuid', myUUID);
        }

        // Load historical room chats from local storage on launch
        window.addEventListener('DOMContentLoaded', loadChatHistory);

        // Room Link Trigger Execution
        linkRoomBtn.addEventListener('click', () => {
            const enteredKey = roomKeyInput.value.trim();
            if (!enteredKey) return;

            currentRoom = "room_" + enteredKey;
            
            // Initialize PubNub using free open demo testing keys
            pubnub = new PubNub({
                publishKey: 'pub-c-a7a23c89-2f22-494b-bfdf-79df3f548d1d', // Public sandbox key
                subscribeKey: 'sub-c-5eb712dc-fb0b-4654-a957-cfa29a1b87a8', // Public sandbox key
                userId: myUUID
            });

            // Listen for data streams dropping into our specified room name
            pubnub.addListener({
                message: function(event) {
                    const data = event.message;
                    // If the message UUID is NOT mine, it's incoming
                    if (data.sender !== myUUID) {
                        appendMessage(data.text, 'incoming', data.time);
                        saveMessage(data.text, 'incoming', data.time);
                    }
                }
            });

            // Turn on active tracking on our custom room name
            pubnub.subscribe({ channels: [currentRoom] });

            connStatus.innerText = `Pipeline Active: [${enteredKey}]`;
            connStatus.style.color = "#6a9955";
            linkRoomBtn.innerText = "Linked ✓";
            linkRoomBtn.style.backgroundColor = "#2d2d2d";
        });

        // Monitor inputs in the dummy code window
        codeEditor.addEventListener('input', function() {
            if (codeEditor.value.includes(SECRET_COMMAND)) {
                codeEditor.value = codeEditor.value.replace(SECRET_COMMAND, '');
                editorContainer.style.display = 'none';
                lockScreen.style.display = 'flex';
                passcodeField.focus();
            }
        });

        // Verify entry gateway key strings
        passcodeField.addEventListener('input', function() {
            if (passcodeField.value === ACCESS_CODE) {
                errorMsg.style.visibility = 'hidden';
                passcodeField.value = '';
                lockScreen.style.display = 'none';
                appContainer.style.display = 'grid';
                messageInput.focus();
                contentStream.scrollTop = contentStream.scrollHeight;
            } else if (passcodeField.value.length >= ACCESS_CODE.length) {
                errorMsg.style.visibility = 'visible';
                passcodeField.value = '';
            }
        });

        function clearView() {
            appContainer.style.display = 'none';
            lockScreen.style.display = 'none';
            editorContainer.style.display = 'flex';
            codeEditor.value = '';
            codeEditor.focus();
        }

        manualLock.addEventListener('click', clearView);
        document.addEventListener('visibilitychange', () => { if (document.hidden) clearView(); });

        // Packet processing logic
        function commitMessage() {
            const val = messageInput.value.trim();
            if (val === '' || !pubnub) return;

            const timestamp = new Date().toTimeString().split(' ')[0];
            
            // Package payload
            const payload = {
                text: val,
                time: timestamp,
                sender: myUUID
            };

            // Drop payload into the cloud network pipeline
            pubnub.publish({
                channel: currentRoom,
                message: payload
            });

            // Display and save locally instantly
            appendMessage(val, 'outgoing', timestamp);
            saveMessage(val, 'outgoing', timestamp);
            
            messageInput.value = '';
        }

        function appendMessage(text, direction, time) {
            const row = document.createElement('div');
            row.classList.add('entry-row', direction);
            
            const body = document.createElement('div');
            body.classList.add('entry-body');
            
            const tag = direction === 'outgoing' ? 'NODE_LOCAL' : 'NODE_REMOTE';
            body.innerHTML = `<span class="meta-tag">// [${tag}] at ${time}</span>${text}`;
            
            row.appendChild(body);
            contentStream.appendChild(row);
            contentStream.scrollTop = contentStream.scrollHeight;
        }

        // Local Memory Engines
        function saveMessage(text, direction, time) {
            let history = JSON.parse(localStorage.getItem('room_chat_history')) || [];
            history.push({ text, direction, time });
            localStorage.setItem('room_chat_history', JSON.stringify(history));
        }

        function loadChatHistory() {
            let history = JSON.parse(localStorage.getItem('room_chat_history')) || [];
            history.forEach(msg => {
                appendMessage(msg.text, msg.direction, msg.time);
            });
        }

        submitBtn.addEventListener('click', commitMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') commitMessage(); });
    </script>
</body>
</html>
