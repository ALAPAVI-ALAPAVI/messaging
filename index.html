<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Workspace IDE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
        }

        body, html {
            background-color: #1e1e1e;
            color: #d4d4d4;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* --- STAGE 1: FRONTEND CODE EDITOR DISGUISE --- */
        #editor-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .editor-header {
            background-color: #2d2d2d;
            padding: 8px 16px;
            font-size: 12px;
            color: #858585;
            border-bottom: 1px solid #3c3c3c;
            display: flex;
            gap: 20px;
        }

        .tab {
            color: #fff;
            border-bottom: 1px solid #007acc;
            padding-bottom: 4px;
            cursor: default;
        }

        .editor-workspace {
            display: flex;
            flex: 1;
            position: relative;
        }

        .line-numbers {
            width: 45px;
            background-color: #1e1e1e;
            padding-top: 16px;
            text-align: right;
            padding-right: 12px;
            color: #858585;
            font-size: 14px;
            line-height: 1.5;
            user-select: none;
        }

        .code-textarea {
            flex: 1;
            background-color: #1e1e1e;
            border: none;
            outline: none;
            color: #9cdcfe;
            padding-top: 16px;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            tab-size: 4;
        }

        /* --- STAGE 2: PASSCODE GATEWAY --- */
        #lock-screen {
            display: none; /* Triggered only by specific string */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-container {
            text-align: center;
            width: 280px;
        }

        .auth-container label {
            display: block;
            font-size: 12px;
            color: #6a9955; /* Comment green style */
            margin-bottom: 12px;
        }

        .passcode-input {
            width: 100%;
            padding: 10px;
            text-align: center;
            font-size: 16px;
            background-color: #2d2d2d;
            border: 1px solid #3c3c3c;
            color: #ce9178;
            border-radius: 4px;
            outline: none;
        }

        .error-msg {
            font-size: 11px;
            color: #f44747;
            margin-top: 8px;
            visibility: hidden;
        }

        /* --- STAGE 3: CHAT VIEW --- */
        #app-container {
            display: none; 
            width: 100%;
            height: 100%;
            grid-template-columns: 240px 1fr;
            background-color: #252526;
        }

        .sidebar {
            background-color: #2d2d2d;
            border-right: 1px solid #3c3c3c;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #3c3c3c;
            font-size: 11px;
            color: #858585;
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
        }

        .list-item {
            padding: 10px 16px;
            font-size: 13px;
            color: #cccccc;
            cursor: pointer;
        }

        .list-item.active {
            background-color: #37373d;
            color: #fff;
        }

        .workspace {
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
        }

        .workspace-header {
            padding: 12px 20px;
            border-bottom: 1px solid #3c3c3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2d2d2d;
        }

        .workspace-title {
            font-size: 13px;
            color: #cccccc;
        }

        .lock-btn {
            background: none;
            border: 1px solid #444;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
            color: #858585;
        }

        .lock-btn:hover {
            background-color: #3c3c3c;
            color: #fff;
        }

        .content-stream {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .entry-row { display: flex; width: 100%; }
        .entry-row.outgoing { justify-content: flex-end; }
        .entry-row.incoming { justify-content: flex-start; }

        .entry-body {
            max-width: 70%;
            font-size: 13px;
            line-height: 1.6;
            color: #d4d4d4;
        }

        .entry-row.outgoing .entry-body { text-align: right; color: #9cdcfe; }
        .entry-row.incoming .entry-body { color: #ce9178; }

        .meta-tag {
            font-size: 11px;
            color: #6a9955;
            margin-bottom: 4px;
            display: block;
        }

        .input-area {
            padding: 16px 24px;
            border-top: 1px solid #3c3c3c;
            display: flex;
            gap: 12px;
            background-color: #1e1e1e;
        }

        .text-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            background-color: #2d2d2d;
            color: #fff;
        }

        .action-btn {
            background-color: #007acc;
            color: #fff;
            border: none;
            padding: 0 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- STAGE 1: THE DISGUISE (CODE INTERFACE) -->
    <div id="editor-container">
        <div class="editor-header">
            <span class="tab">scratchpad.js</span>
            <span>output.log</span>
            <span>config.json</span>
        </div>
        <div class="editor-workspace">
            <div class="line-numbers">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</div>
            <textarea id="codeEditor" class="code-textarea" spellcheck="false" autofocus placeholder="// Type runtime adjustments or scratch code configurations here..."></textarea>
        </div>
    </div>

    <!-- STAGE 2: HIDDEN GATEWAY -->
    <div id="lock-screen">
        <div class="auth-container">
            <label for="passcode">/* RUNTIME_AUTH_REQUIRED */</label>
            <input type="password" id="passcode" class="passcode-input" maxlength="8" placeholder="••••">
            <div id="error" class="error-msg">Execution signature failed.</div>
        </div>
    </div>

    <!-- STAGE 3: THE DISCREET CHAT ENVIRONMENT -->
    <div id="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">RUNTIME_REPOSITORIES</div>
            <div class="list-container">
                <div class="list-item active">buffer_stream_01.log</div>
                <div class="list-item">sys_diagnostic.bak</div>
            </div>
        </aside>

        <main class="workspace">
            <header class="workspace-header">
                <div class="workspace-title">buffer_stream_01.log</div>
                <button class="lock-btn" id="manual-lock">Abort Session</button>
            </header>
            
            <div class="content-stream" id="contentStream">
                <div class="entry-row incoming">
                    <div class="entry-body">
                        <span class="meta-tag">// [NODE_REMOTE_01]</span>
                        Data update successfully complete. Standing by for instructions.
                    </div>
                </div>
            </div>
            
            <footer class="input-area">
                <input type="text" class="text-input" id="messageInput" placeholder="Write to buffer...">
                <button class="action-btn" id="submitBtn">Execute</button>
            </footer>
        </main>
    </div>

    <script>
        // CONFIGURATIONS
        const SECRET_COMMAND = "// system.initialize.terminal.call()";
        const ACCESS_CODE = "1234";

        // Element Selectors
        const codeEditor = document.getElementById('codeEditor');
        const lockScreen = document.getElementById('lock-screen');
        const editorContainer = document.getElementById('editor-container');
        const appContainer = document.getElementById('app-container');
        const passcodeField = document.getElementById('passcode');
        const errorMsg = document.getElementById('error');
        const manualLock = document.getElementById('manual-lock');
        const messageInput = document.getElementById('messageInput');
        const submitBtn = document.getElementById('submitBtn');
        const contentStream = document.getElementById('contentStream');

        // Monitoring the code entry area for the target string
        codeEditor.addEventListener('input', function() {
            if (codeEditor.value.includes(SECRET_COMMAND)) {
                // Instantly clean up the text editor value to clear tracks
                codeEditor.value = codeEditor.value.replace(SECRET_COMMAND, '');
                
                // Hide editor layer, present secondary verification field
                editorContainer.style.display = 'none';
                lockScreen.style.display = 'flex';
                passcodeField.focus();
            }
        });

        // Passcode Validation
        passcodeField.addEventListener('input', function() {
            if (passcodeField.value === ACCESS_CODE) {
                errorMsg.style.visibility = 'hidden';
                passcodeField.value = '';
                lockScreen.style.display = 'none';
                appContainer.style.display = 'grid';
                messageInput.focus();
            } else if (passcodeField.value.length >= ACCESS_CODE.length) {
                errorMsg.style.visibility = 'visible';
                passcodeField.value = '';
            }
        });

        // Abort/Lock function back to standard code template
        function hardReset() {
            appContainer.style.display = 'none';
            lockScreen.style.display = 'none';
            editorContainer.style.display = 'flex';
            codeEditor.value = ''; // Wipes screen on exit
            codeEditor.focus();
        }

        manualLock.addEventListener('click', hardReset);

        // Security check: if the window loses visibility, revert to standard text editor instantly
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                hardReset();
            }
        });

        // App Messaging Mechanism
        function commitMessage() {
            const val = messageInput.value.trim();
            if (val === '') return;

            const row = document.createElement('div');
            row.classList.add('entry-row', 'outgoing');
            
            const body = document.createElement('div');
            body.classList.add('entry-body');
            
            const timestamp = new Date().toTimeString().split(' ')[0];
            body.innerHTML = `<span class="meta-tag">// [NODE_LOCAL] at ${timestamp}</span>${val}`;
            
            row.appendChild(body);
            contentStream.appendChild(row);
            
            messageInput.value = '';
            contentStream.scrollTop = contentStream.scrollHeight;
        }

        submitBtn.addEventListener('click', commitMessage);
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') commitMessage();
        });
    </script>
</body>
</html>
